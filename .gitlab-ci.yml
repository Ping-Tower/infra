stages:
  - validate
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  KUBE_CONTEXT: pingtower/infra:pingtower

default:
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags:
    - saas-linux-small-amd64
  before_script:
    - kubectl config use-context "$KUBE_CONTEXT"
  timeout: 10m

validate:
  stage: validate
  interruptible: true
  script:
    # Namespace и RBAC заранее создаёт администратор: у агента нет cluster-wide прав.
    - kubectl apply --dry-run=server
        -f k8s/secrets/
        -f k8s/configmap.yaml
        -f k8s/postgres/
        -f k8s/redis/
        -f k8s/rabbitmq/
        -f k8s/clickhouse/
        -f k8s/networkpolicy.yaml

deploy:
  stage: deploy
  resource_group: pingtower-production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  manual_confirmation: "Развернуть инфраструктуру PingTower в production?"
  script:
    - kubectl apply -f k8s/secrets/
    - kubectl -n pingtower wait --for=condition=Ready
        externalsecret/postgres-admin
        externalsecret/postgres-app
        externalsecret/redis
        externalsecret/rabbitmq
        externalsecret/clickhouse
        externalsecret/gitlab-registry --timeout=120s
    - kubectl -n pingtower get secret postgres-admin postgres-app redis rabbitmq clickhouse gitlab-registry -o name
    # Общий ConfigMap до statefulset'ов: init-контейнер rabbitmq читает его.
    - kubectl apply -f k8s/configmap.yaml
    - kubectl apply -f k8s/postgres/ -f k8s/redis/ -f k8s/rabbitmq/ -f k8s/clickhouse/
    - kubectl apply -f k8s/networkpolicy.yaml
    - kubectl -n pingtower rollout status statefulset/postgres --timeout=300s
    - kubectl -n pingtower rollout status statefulset/redis --timeout=300s
    - kubectl -n pingtower rollout status statefulset/rabbitmq --timeout=300s
    - kubectl -n pingtower rollout status statefulset/clickhouse --timeout=600s
    - kubectl -n pingtower get pods,pvc,svc
