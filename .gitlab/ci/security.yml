# Security gates adapted from tramplin1. Versions are pinned for reproducible CI.
.security-check:
  tags:
    - saas-linux-small-amd64
  before_script: []
  after_script: []
  services: []
  cache: []
  interruptible: true
  timeout: 20m
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - security-reports/
gitleaks:
  extends: .security-check
  stage: validate
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint:
      - ''
  script:
    - mkdir -p security-reports
    - gitleaks detect --source . --no-git --redact --report-format json --report-path security-reports/gitleaks.json
