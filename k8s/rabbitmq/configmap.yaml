# Топология брокера: exchanges/queues/bindings взяты дословно из
# pingtower/infra/rabbitmq/config/definitions.json (контракт — infra/rabbitmq/asyncapi.yaml).
# Секция users/permissions в definitions пустая по назначению: init-контейнер
# вшивает пользователя из Secret (см. rabbitmq.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: pingtower
data:
  rabbitmq.conf: |
    definitions.import_backend = local_filesystem
    definitions.local.path = /etc/rabbitmq/definitions/definitions.json
    vm_memory_high_watermark.relative = 0.6
    disk_free_limit.absolute = 1GB
  definitions.json: |
    {
      "vhosts": [
        {
          "name": "/"
        }
      ],
      "exchanges": [
        {
          "name": "serverEventsExchange",
          "vhost": "/",
          "type": "topic",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        },
        {
          "name": "pingEventsExchange",
          "vhost": "/",
          "type": "topic",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        },
        {
          "name": "statusEventsExchange",
          "vhost": "/",
          "type": "topic",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        }
      ],
      "queues": [
        {
          "name": "emailQueue",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        },
        {
          "name": "telegramQueue",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        },
        {
          "name": "q.ping-service.server-events",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        },
        {
          "name": "q.state-elevator.server-events",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        },
        {
          "name": "q.metrics-writer.ping-events",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        },
        {
          "name": "q.state-elevator.ping-events",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        },
        {
          "name": "q.api.status-events",
          "vhost": "/",
          "durable": true,
          "auto_delete": false,
          "arguments": {}
        }
      ],
      "bindings": [
        {
          "source": "serverEventsExchange",
          "vhost": "/",
          "destination": "q.ping-service.server-events",
          "destination_type": "queue",
          "routing_key": "server.target.*",
          "arguments": {}
        },
        {
          "source": "serverEventsExchange",
          "vhost": "/",
          "destination": "q.state-elevator.server-events",
          "destination_type": "queue",
          "routing_key": "server.target.*",
          "arguments": {}
        },
        {
          "source": "pingEventsExchange",
          "vhost": "/",
          "destination": "q.metrics-writer.ping-events",
          "destination_type": "queue",
          "routing_key": "server.ping.recorded",
          "arguments": {}
        },
        {
          "source": "pingEventsExchange",
          "vhost": "/",
          "destination": "q.state-elevator.ping-events",
          "destination_type": "queue",
          "routing_key": "server.ping.recorded",
          "arguments": {}
        },
        {
          "source": "statusEventsExchange",
          "vhost": "/",
          "destination": "q.api.status-events",
          "destination_type": "queue",
          "routing_key": "server.status.changed",
          "arguments": {}
        }
      ]
    }
