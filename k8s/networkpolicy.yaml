# Хранилища и брокер принимают трафик только от pod'ов своих приложений
# (или миграционного Job). Правила ужесточаем по мере появления сервисов.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: pingtower
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - api
                  - api-migrate
      ports:
        - protocol: TCP
          port: 5432
---
