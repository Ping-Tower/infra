# Читает Variables из infra-проекта GitLab.
# projectID замени на числовой ID проекта pingtower/infra перед первым деплоем.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gitlab-pingtower-infra
  namespace: pingtower
spec:
  provider:
    gitlab:
      url: https://gitlab.com
      projectID: "REPLACE_WITH_INFRA_PROJECT_ID"
      environment: "*"
      auth:
        SecretRef:
          accessToken:
            name: gitlab-token
            key: token
