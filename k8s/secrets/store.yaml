# Читает Variables из infra-проекта GitLab (pingtower/infra, id 80768376).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gitlab-pingtower-infra
  namespace: pingtower
spec:
  provider:
    gitlab:
      url: https://gitlab.com
      projectID: "80768376"
      environment: "*"
      auth:
        SecretRef:
          accessToken:
            name: gitlab-token
            key: token
