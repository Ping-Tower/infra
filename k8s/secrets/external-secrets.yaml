# Variables репозитория pingtower/infra → Kubernetes Secrets.
# Настройки Variables: Masked, Protected, environment scope *, Expand выключен.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-admin
  namespace: pingtower
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitlab-pingtower-infra
    kind: SecretStore
  target:
    name: postgres-admin
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: POSTGRES_ADMIN_PASSWORD
---
