apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: pingtower
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: pingtower
spec:
  serviceName: redis
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: redis
          # state-elevator использует REDIS db 1, ping-service — db 2, api — db 0.
          image: redis:7-alpine
          command: [sh, -c]
          args:
            - >-
              exec docker-entrypoint.sh redis-server
              --requirepass "$REDISCLI_AUTH"
              --dir /data
              --appendonly yes
              --appendfsync everysec
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          startupProbe:
            exec:
              command: [sh, -c, 'redis-cli -a "$REDISCLI_AUTH" ping | grep -qx PONG']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'redis-cli -a "$REDISCLI_AUTH" ping | grep -qx PONG']
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data
          mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              # entrypoint переключает процесс на пользователя redis
              # и ч.mainнит /data — нужны setuid/setgid/chown.
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
