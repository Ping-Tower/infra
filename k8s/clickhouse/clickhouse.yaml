apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: pingtower
spec:
  clusterIP: None
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: pingtower
spec:
  serviceName: clickhouse
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 101
      containers:
        - name: clickhouse
          # Версия из локального стека (infra/clickhouse): table schema совместим.
          image: clickhouse/clickhouse-server:24.8
          ports:
            - name: http
              containerPort: 8123
          env:
            - name: CLICKHOUSE_DB
              value: pingtower_analytics
            - name: CLICKHOUSE_USER
              value: pingtower_app
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse
                  key: password
            # clickhouse/clickhouse-server создаёт CLICKHOUSE_USER при старте
            # вместе с флагом default access management (полные права на init).
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: '1'
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          startupProbe:
            exec:
              command: [sh, -c, 'clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --query "SELECT 1"']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD" --query "SELECT 1"']
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
        - name: init
          configMap:
            name: clickhouse-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
